<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121213" />
  <title>Family Word</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="helpBtn" class="icon-btn" aria-label="How to play">?</button>
      <div>
        <h1>Family Word</h1>
        <p id="dayLabel" class="subtitle"></p>
      </div>
      <button id="statsBtn" class="icon-btn" aria-label="Statistics">▥</button>
    </header>

    <section id="message" class="message" aria-live="polite"></section>
    <section id="board" class="board" aria-label="Word grid"></section>
    <section id="keyboard" class="keyboard" aria-label="Keyboard"></section>

    <footer>
      <button id="shareBtn" class="primary hidden">Share result</button>
      <p class="footer-note">One word. One family. No adverts.</p>
    </footer>
  </main>

  <dialog id="helpDialog">
    <form method="dialog" class="modal">
      <button class="close" aria-label="Close">×</button>
      <h2>How to play</h2>
      <p>Guess the five-letter word in six tries.</p>
      <p><span class="sample correct">A</span> right letter, right place.</p>
      <p><span class="sample present">E</span> right letter, wrong place.</p>
      <p><span class="sample absent">R</span> not in the word.</p>
      <p>Everyone gets the same word each day.</p>
    </form>
  </dialog>

  <dialog id="statsDialog">
    <form method="dialog" class="modal">
      <button class="close" aria-label="Close">×</button>
      <h2>Your stats</h2>
      <div class="stats">
        <div><strong id="played">0</strong><span>Played</span></div>
        <div><strong id="winPct">0</strong><span>Win %</span></div>
        <div><strong id="streak">0</strong><span>Streak</span></div>
        <div><strong id="maxStreak">0</strong><span>Max</span></div>
      </div>
    </form>
  </dialog>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>

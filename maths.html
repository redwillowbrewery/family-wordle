<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121213">
  <title>Family Maths</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="maths-header"><h1>Family Maths</h1><p id="date" class="subtitle"></p></header>
    <nav class="game-nav" aria-label="Daily games">
      <a href="./">Word</a><a href="maths.html" aria-current="page">Maths</a>
    </nav>
    <article class="challenge">
      <p id="topic" class="topic"></p>
      <h2 id="title"></h2>
      <p id="question"></p>
      <details><summary>Give me a hint</summary><p id="hint"></p></details>
      <form id="answer-form">
        <label for="answer">Your answer <small>(whole number)</small></label>
        <div class="entry"><input id="answer" inputmode="numeric" required autocomplete="off"><button class="primary">Check</button></div>
      </form>
      <p id="feedback" role="status"></p>
      <details id="working"><summary>Worked solution</summary><p id="solution"></p></details>
      <aside id="stretch" hidden><h3>Take it further</h3><p id="extension"></p></aside>
    </article>
  </main>
  <script src="challenges.js"></script>
  <script src="maths.js"></script>
</body>
</html>
